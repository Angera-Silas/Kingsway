name: UI Smoke Tests

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, openssl, curl, zip

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install browser dependency
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: |
          node --check js/api.js
          find js/pages js/core js/components -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Start isolated Apache server
        # Hard Rule 3: the app is served by Apache, never the PHP built-in
        # server. php:8.4-apache runs the checkout with mod_php and .htaccess.
        env:
          APP_ENV: development
          BASE_URL: http://127.0.0.1:8081
          JWT_SECRET: ci-only-public-ui-smoke-secret-value-not-used-outside-this-job-2026
        run: |
          printf 'APP_ENV=%s\nBASE_URL=%s\nJWT_SECRET=%s\nTFA_ENCRYPTION_KEY=%s\nREALTIME_BUFFER_SECRET=%s\n' \
            "$APP_ENV" "$BASE_URL" "$JWT_SECRET" \
            '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' \
            'ci-only-realtime-buffer-secret-value-that-is-not-used-outside-this-job-2026' \
            > config/.env
          mkdir -p logs storage
          chmod -R a+rwX logs storage
          docker run -d --name kingsway-web -p 127.0.0.1:8081:80 \
            -v "$GITHUB_WORKSPACE":/var/www/html php:8.4-apache
          docker exec kingsway-web sh -c "a2enmod rewrite headers >/dev/null \
            && sed -i 's/AllowOverride None/AllowOverride All/' /etc/apache2/apache2.conf \
            && apache2ctl -k graceful"

      - name: Wait for application
        run: |
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8081/index.php >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs kingsway-web
            exit 1
          fi

      - name: Run deterministic public UI smoke test
        env:
          BASE_URL: http://127.0.0.1:8081
        run: node .github/scripts/public-ui-smoke.js

      - name: Show server log after failure
        if: failure()
        run: docker logs kingsway-web || true

      - name: Stop Apache server
        if: always()
        run: docker rm -f kingsway-web 2>/dev/null || true
