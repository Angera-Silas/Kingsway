# --- operational workers ---
  - name: queue_drain
    kind: http
    endpoint: /api/realtime/worker
    payload: {"limit":30}
    interval: 60
  - name: outbox
    kind: http
    endpoint: /api/communications/process-outbox
    payload: {"limit":25}
    interval: 60

# --- operational workers (dispatched over HTTP; no DB connection from cron) ---
# These were the remaining lines from the old per-endpoint crontab. They are
# dispatched by the scheduler on its existing connection budget: the tick
# process holds no MySQL connection for an HTTP job, and the PHP endpoint it
# calls is a normal request that opens its own (persistent) connection like any
# other user request.

  - name: staff_invitations
    kind: http
    endpoint: /api/staff-migration/process-invitation-email
    payload: {"limit":25}
    interval: 300

  - name: attendance_reminders
    kind: http
    endpoint: /api/attendance/process-register-reminders
    payload: {}
    interval: 300

  - name: kcb_reconciliation
    kind: http
    endpoint: /api/finance/kcb-reconciliation-worker
    payload: {"limit":25}
    interval: 300

  - name: stk_sweep
    kind: http
    endpoint: /api/payments/stk-sweep-worker
    payload: {"limit":25,"stall_minutes":30}
    interval: 600

  - name: sms_contact_sync
    kind: http
    endpoint: /api/communications/sync-sms-contacts
    payload: {}
    interval: 900

  - name: realtime_cleanup
    kind: http
    endpoint: /api/realtime/cleanup
    payload: {}
    interval: 300

  - name: insight_brief_daily
    kind: http
    endpoint: /api/dashboard/insight-brief-queue
    payload: {"cadence":"daily"}
    interval: 300

  - name: insight_brief_weekly
    kind: http
    endpoint: /api/dashboard/insight-brief-queue
    payload: {"cadence":"weekly"}
    interval: 300

  - name: agent_digest
    kind: http
    endpoint: /api/dashboard/agent-digest-worker
    payload: {}
    interval: 300

  - name: kicd_policy_watch
    kind: http
    endpoint: /api/dashboard/kicd-policy-watch
    payload: {}
    interval: 300

