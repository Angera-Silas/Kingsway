# Kingsway schedule manifest - consumed by python_platform/app/scheduler.py
#
# ONE crontab line pokes /internal/tick once a minute. This file is the
# schedule. Adding a job never adds a cron line, so the MySQL connection count
# stays constant regardless of how many jobs are listed.
#
# interval = seconds between runs, derived from each projection's max_age_seconds
# freshness budget so it is refreshed exactly as often as the read model allows.

