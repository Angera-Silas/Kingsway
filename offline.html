<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>No connection · Kingsway Preparatory School</title>
    <!--
        Served by the service worker in place of a page that could not be
        reached, at that page's own URL. It must be fully self-contained: no
        stylesheet, script, font or image requests, because the server is
        unreachable. When the server answers again it reloads the same URL,
        so the user lands exactly where they were going.
    -->
    <style>
        :root {
            --bg: #f6f4ee;
            --card: #ffffff;
            --text: #1d2b25;
            --muted: #5d6b65;
            --accent: #11513d;
            --accent-text: #ffffff;
            --border: #dfe5e1;
            --warn: #8a5a00;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #111715;
                --card: #19221f;
                --text: #e7eeea;
                --muted: #9fb0a8;
                --accent: #4fae86;
                --accent-text: #0b1a14;
                --border: #2a3632;
                --warn: #e2b35a;
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main {
            width: 100%;
            max-width: 440px;
            padding: 32px 28px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            text-align: center;
        }
        .icon { width: 44px; height: 44px; color: var(--warn); margin-bottom: 12px; }
        h1 { margin: 0 0 8px; font-size: 1.3rem; line-height: 1.3; }
        p { margin: 0 0 20px; color: var(--muted); }
        button {
            min-width: 140px;
            padding: 10px 20px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: var(--accent-text);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: progress; }
        button:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
        .status { margin: 16px 0 0; font-size: .875rem; min-height: 1.3em; }
        .school { margin: 24px 0 0; font-size: .8rem; letter-spacing: .02em; }
    </style>
</head>
<body>
    <main>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 8.82a15 15 0 0 1 5.24-3.16"></path>
            <path d="M10.71 5.05A15 15 0 0 1 22 8.82"></path>
            <path d="M5 12.55a10 10 0 0 1 5.17-2.39"></path>
            <path d="M13.66 10.13A10 10 0 0 1 19 12.55"></path>
            <path d="M8.53 16.11a5 5 0 0 1 6.95 0"></path>
            <path d="M12 20h.01"></path>
            <path d="m3 3 18 18"></path>
        </svg>
        <h1 id="title">Can't reach the school server</h1>
        <p id="message">Check your Wi-Fi or mobile data. This page will open by itself as soon as the connection is back.</p>
        <button type="button" id="retry">Try again</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <p class="school">Kingsway Preparatory School</p>
    </main>

    <script>
        (() => {
            'use strict';

            // When opened directly (not as a stand-in), resume to the app shell.
            const onOfflinePage = /\/offline\.html$/.test(window.location.pathname);
            const target = onOfflinePage
                ? window.location.pathname.replace(/\/offline\.html$/, '/home.php')
                : window.location.href;

            const DELAYS_MS = [3000, 5000, 10000, 15000];
            const TIMEOUT_MS = 8000;

            const retry = document.getElementById('retry');
            const status = document.getElementById('status');
            const title = document.getElementById('title');
            const message = document.getElementById('message');

            let attempt = 0;
            let timer = null;
            let checking = false;
            let leaving = false;

            function clock() {
                return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            function showDeviceState() {
                if (navigator.onLine === false) {
                    title.textContent = 'You are offline';
                    message.textContent = 'This device has no network connection. This page will open by itself as soon as you are back online.';
                } else {
                    title.textContent = "Can't reach the school server";
                    message.textContent = 'Check your Wi-Fi or mobile data. This page will open by itself as soon as the connection is back.';
                }
            }

            // HEAD requests bypass the service worker and need no session, so
            // any answer from the server below 500 means the page can load.
            async function serverAnswers() {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), TIMEOUT_MS);
                try {
                    const response = await fetch(target, {
                        method: 'HEAD',
                        cache: 'no-store',
                        credentials: 'same-origin',
                        redirect: 'manual',
                        signal: controller.signal,
                    });
                    return response.type === 'opaqueredirect' || response.status < 500;
                } catch (_) {
                    return false;
                } finally {
                    clearTimeout(timeout);
                }
            }

            async function check() {
                if (checking || leaving) return;
                clearTimeout(timer);
                showDeviceState();
                if (navigator.onLine === false) {
                    status.textContent = '';
                    return; // the 'online' event will call check()
                }
                checking = true;
                retry.disabled = true;
                status.textContent = 'Checking…';
                const ok = await serverAnswers();
                checking = false;
                retry.disabled = false;
                if (ok) {
                    leaving = true;
                    status.textContent = 'Connected. Opening the page…';
                    window.location.replace(target);
                    return;
                }
                status.textContent = `Still unreachable · last checked ${clock()}`;
                const delay = DELAYS_MS[Math.min(attempt, DELAYS_MS.length - 1)];
                attempt += 1;
                timer = setTimeout(() => {
                    if (document.visibilityState === 'visible') check();
                }, delay);
            }

            retry.addEventListener('click', () => { attempt = 0; check(); });
            window.addEventListener('online', () => { attempt = 0; check(); });
            window.addEventListener('offline', () => { clearTimeout(timer); showDeviceState(); status.textContent = ''; });
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') check();
            });

            check();
        })();
    </script>
</body>
</html>
